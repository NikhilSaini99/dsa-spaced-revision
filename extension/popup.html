<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .empty {
      text-align: center;
      padding: 24px 0;
      color: #64748b;
      font-size: 13px;
    }
    #list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
    }
    .item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .item-name {
      font-weight: 600;
      font-size: 13px;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .item-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .btn-ghost {
      background: #1e293b;
      border: 1px solid #475569;
      color: #94a3b8;
    }
    #status {
      text-align: center;
      font-size: 11px;
      color: #22c55e;
      margin-top: 10px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <h1>📋 DSA Tracker Queue</h1>
  <div id="list"></div>
  <div class="actions" id="actions" style="display:none">
    <button class="btn btn-primary" id="pushBtn">🚀 Push to Tracker</button>
    <button class="btn btn-ghost" id="clearBtn">🗑 Clear All</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
